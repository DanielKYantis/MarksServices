name: Deploy to IONOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ionos-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy main to IONOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Build deploy directory
        run: |
          rm -rf deploy
          mkdir -p deploy

          find . -maxdepth 1 -type f -name '*.php' -exec cp -p {} deploy/ \;

          cp -a assets deploy/assets
          cp -a forms deploy/forms
          cp -a includes deploy/includes

          if [ -f .htaccess ]; then cp -p .htaccess deploy/.htaccess; fi
          if [ -f robots.txt ]; then cp -p robots.txt deploy/robots.txt; fi
          if [ -f sitemap.xml ]; then cp -p sitemap.xml deploy/sitemap.xml; fi

          find deploy -name '.DS_Store' -delete
          find deploy -type f -name '*.map' -delete

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via SFTP
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_REMOTE_PATH: ${{ secrets.IONOS_REMOTE_PATH }}
        run: |
          : "${IONOS_SFTP_HOST:?Missing IONOS_SFTP_HOST}"
          : "${IONOS_SFTP_USER:?Missing IONOS_SFTP_USER}"
          : "${IONOS_SFTP_PASSWORD:?Missing IONOS_SFTP_PASSWORD}"
          : "${IONOS_REMOTE_PATH:?Missing IONOS_REMOTE_PATH}"

          PORT="${IONOS_SFTP_PORT:-22}"

          lftp -u "$IONOS_SFTP_USER","$IONOS_SFTP_PASSWORD" -p "$PORT" "sftp://$IONOS_SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 2
          set mirror:parallel-transfer-count 4
          mirror --reverse --delete --verbose --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .env --exclude-glob .env.example ./deploy "$IONOS_REMOTE_PATH"
          bye
          EOF
